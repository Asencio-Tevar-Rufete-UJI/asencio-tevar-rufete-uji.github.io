<title>Asencio Tevar Rufete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow contact card, ISTENER blue header with a −80 → 180 °C temperature strip, actions, then research focus */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#14212d; --muted:#5a6876; --line:#d9e1e8;
  --brand:#0e5e96; --brand-ink:#ffffff; --brand-soft:#e3eef7;
  --cold:#2a86c7; --warm:#f08a24; --hot:#e0352b; --leaf:#5aa846;
  --display:"Saira Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1319; --surface:#141e27; --ink:#e7edf2; --muted:#9aa8b5; --line:#24323e;
  --brand:#0f5487; --brand-ink:#ffffff; --brand-soft:#16293a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1319; --surface:#141e27; --ink:#e7edf2; --muted:#9aa8b5; --line:#24323e;
  --brand:#0f5487; --brand-ink:#ffffff; --brand-soft:#16293a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 32px}
.card{max-width:440px;margin:0 auto;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(10,30,50,.06),0 12px 32px rgba(10,30,50,.10)}
.head{background:var(--brand);color:var(--brand-ink);padding:18px 20px 22px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.group{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
.group img{width:30px;height:30px;background:#fff;border-radius:8px;padding:3px}
.lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;padding:4px 11px;color:#fff;opacity:.75}
.lang button[aria-pressed="true"]{background:#fff;color:var(--brand);opacity:1}
.lang button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.who{display:flex;gap:16px;align-items:center;margin-top:22px}
.who img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #fff;flex:none}
.who div{min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.role{margin:6px 0 0;font-size:15px;opacity:.92}
.scale{margin-top:20px}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cold) 0%,#7fb6d9 30%,var(--leaf) 50%,var(--warm) 75%,var(--hot) 100%)}
.ticks{display:flex;justify-content:space-between;font-family:var(--display);font-size:12px;letter-spacing:.04em;margin-top:5px;opacity:.85;font-variant-numeric:tabular-nums}
.body{padding:20px;display:grid;gap:18px}
.actions{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;font-family:var(--body);width:100%;text-align:left}
.btn svg{width:22px;height:22px;flex:none}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary small{color:rgba(255,255,255,.8)}
.btn:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.info{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.row{display:flex;gap:12px;align-items:flex-start}
.row svg{width:20px;height:20px;flex:none;color:var(--brand);margin-top:2px}
:root[data-theme="dark"] .row svg{color:#7fb6d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row svg{color:#7fb6d9}}
.row div{min-width:0}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.val{overflow-wrap:anywhere}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--brand);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
:root[data-theme="dark"] .copy{color:#7fb6d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .copy{color:#7fb6d9}}
.copy:focus-visible{outline:2px solid var(--warm)}
.research{background:var(--brand-soft);border-radius:14px;padding:16px}
.research h2{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--brand)}
:root[data-theme="dark"] .research h2{color:#7fb6d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .research h2{color:#7fb6d9}}
.research p{margin:0}
.research ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.research li{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seek{margin-top:12px;font-size:15px}
.seek b{font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
/* slide viewer */
.viewer{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.vbar strong{font-family:var(--display);font-size:16px}
.vbar a,.vbar button{all:unset;cursor:pointer;font-weight:600;font-size:14px;color:var(--brand);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.vbar .acts{display:flex;gap:8px}
.slides{overflow-y:auto;padding:16px;display:grid;gap:14px;justify-items:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.slides img{width:100%;max-width:900px;border-radius:8px;border:1px solid var(--line);background:#fff}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .5s ease-out both}@keyframes rise{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>
<body>

<main class="card">
